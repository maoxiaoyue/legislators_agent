# Legagent gRPC Service Configuration
app:
  name: "legagent"
  version: "0.1.0"

grpc:
  addr: ":9090"
  # tls:
  #   enabled: false
  #   cert_file: ""
  #   key_file: ""

database:
  driver: ""
  dsn: ""

logger:
  level: info
  output: stdout
  colors: true

# 向量嵌入（embedding）提供者。
#   provider: openai  — 任何 OpenAI 相容 /v1/embeddings 端點（OpenAI、Voyage、LM Studio、vLLM、Ollama 的 /v1）
#   provider: ollama  — 本地 Ollama 原生 API（建議模型 bge-m3，繁中效果佳）
#   provider: lexical — 離線字元 n-gram 雜湊向量；僅供測試與無模型環境，非語意向量
# 金鑰與網址一律由環境變數注入，禁止寫死在此檔。
embedding:
  provider: "${EMBEDDING_PROVIDER:-ollama}"
  base_url: "${EMBEDDING_BASE_URL}"
  api_key: "${EMBEDDING_API_KEY}"
  model: "${EMBEDDING_MODEL:-bge-m3}"
  concurrency: 4

# 向量資料庫（內嵌式 chromem-go，持久化於本地目錄；可日後換成 pgvector）。
vector:
  path: "data/vectors"
  collection: "ly_rules"
  compress: false

# 議事規則資料來源：法務部全國法規資料庫公開資料（法律 + 命令 XML）。
rules:
  data_dir: "data/laws"         # 解析後的結構化 JSON（可入版控）
  cache_dir: "data/raw"         # 下載的原始 zip / xml 快取（不入版控）
  cache_max_age_hours: 720      # 30 天內不重複下載，遵守官方下載頻率規範
  category_prefixes: ["立法"]   # 法規類別前綴；「立法」= 立法院主管之法規
  names: []                     # 額外指定要納入的法規名稱
  exclude_repealed: true
